[package]
name = "tapectl"
version = "1.7.0"
edition = "2021"
description = "Multi-tenant archival storage management for LTO tape and exportable encrypted directories"
license = "AGPL-3.0"
rust-version = "1.94"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4"
rusqlite = { version = "0.39", features = ["bundled", "serde_json", "backup"] }
rusqlite_migration = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# `config set/add/remove` (issue #143) edit config.toml keeping its comments.
# Already built as `toml` 0.8's own parser, so this adds no crate to the tree.
toml_edit = "0.22"
sha2 = { version = "0.10", features = ["asm"] }
# The hash behind `pass_count::Sha256` (issue #488, the CTO's 2026-10-20
# approval of the write-shaping note's §12 item 4): `ring`'s SHA-256 is OpenSSL's
# SSSE3 code, about 32% faster than `sha2`'s `asm` on CPUs without SHA-NI such as
# home2's Westmere, and builds static for musl. `sha2` stays for its `Digest` traits
# (the counted type implements them) and as the `research` build's baseline.
ring = { version = "0.17", default-features = false }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
dialoguer = "0.11"
tabled = "0.15"
walkdir = "2"
bytesize = "2"
glob = "0.3"
age = { version = "0.11", features = ["cli-common"] }
# `crypto::chunks` reads an age payload one chunk at a time (issue #480); both are
# already in the tree under `age`, at these versions.
age-core = "0.11"
chacha20poly1305 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
# `termination`: SIGTERM and SIGHUP reach the same handler as SIGINT (issue #404).
ctrlc = { version = "3", features = ["termination"] }
nix = { version = "0.29", features = ["ioctl", "fs", "user"] }
indicatif = "0.17"
rand = "0.9"
tar = "0.4"
tempfile = "3"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }

[features]
# Issue #488: the write-shaping experiment knobs (`TAPECTL_EXP_*`, `crate::research`).
# OFF by default and in no production build: without it the variables are ignored
# and a set one draws one warning line.
research = []

[dev-dependencies]
clap_mangen = "0.2"
# `hooks` for `commit_hook`: the on-tape catalog.db build is asserted to be one
# transaction by counting its commits (issue #399). `trace` for `trace_v2`: the
# catalog commands' statement and query-plan budgets (issue #416).
rusqlite = { version = "0.39", features = ["hooks", "trace"] }
# `inotify`: the staging audit watches every file `stage create` makes under
# staging (issue #370, `staging::plaintext_audit`). `resource`: `getrusage`,
# for the staging benchmark's disk-read count (issue #364). Tests only.
nix = { version = "0.29", features = ["inotify", "resource"] }

[profile.release]
lto = true
strip = true
