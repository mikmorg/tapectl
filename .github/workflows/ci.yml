# CI for the ungated suite only. The mhvtl e2e gate is deliberately NOT here:
# it needs an out-of-tree kernel module that GitHub-hosted runners cannot load,
# and a self-hosted runner is rejected while this repo is public (see the
# 2026-07-20 tests/CI audit, docs/audits/2026-07-20-tests-ci-operability.md,
# "CI feasibility verdict"). Restore-path diffs run scripts/mhvtl-verify-gate.sh
# locally by convention (issue #7). The perf suite is manual (VM-pinned
# baselines, release build).
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # rust-toolchain.toml pins 1.94.1; this action reads it. fmt/clippy
        # results are only meaningful on the pinned toolchain (audit T4).
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Install the test tools
        # The ungated suite is NOT hermetic: staging runs the real GNU tar, and
        # `tests/cli_smoke.rs` spawns `stage create`, which does the same.
        # Without these tools those tests fail, and they had been failing here
        # for many commits once while every local `cargo test` passed (issue
        # #43): this job reported red so consistently that its signal had
        # stopped meaning anything.
        #
        # Layout 3 (2.0.0) needs what its tests run for real: `acl` (setfacl
        # and getfacl, for the stream's ACL checks) and the decompressor of
        # each algorithm it carries (ADR-0012 item 285: gzip, xz, zstd), which
        # read library-made slices back.
        run: |
          sudo apt-get update
          sudo apt-get install -y acl attr gzip xz-utils zstd
          getfacl --version | head -1
          gzip --version | head -1
          xz --version | head -1
          zstd --version | head -1

      - name: The runner's tar
        # Layout 3's writer is GNU tar at or above the floor (ADR-0012 item 274: 1.35,
        # built with ACL support). The line is kept in every run so that a runner image
        # that changes its tar shows it here first.
        run: tar --version | head -1

      - name: Run tests
        # Debug profile on purpose — release builds are for publishing and the
        # perf suite only (house build rule). No $HOME dependence and no tape
        # devices: the mhvtl e2e and perf suites stay gated out (see the
        # header). The external tools this suite genuinely needs are
        # installed above (tar is the runner's own). --no-fail-fast: cargo otherwise stops at the first
        # failing test binary, so a red lib binary hid every binary after it
        # (2026-10-21 to 10-24, when the runner moved to Ubuntu 26).
        run: cargo test --locked --no-fail-fast

  heir-script:
    name: RESTORE.sh lint
    # The heir's script (src/volume/heir/RESTORE.sh, File 2 of every Layout 3
    # tape; the plan's T4.10, #553) is a shell file, so it is linted as one:
    # `bash -n`, `shellcheck` at warning level, and its awk programs run under
    # every awk an heir may have (gawk, mawk, BusyBox awk). The tests that do
    # the third are the `lint_` tests of tests/heir_restore.rs; with
    # TAPECTL_REQUIRE_HEIR_TOOLS=1 a missing tool fails them instead of
    # skipping them, so a lint that did not run is never green.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Install the lint tools and what the script's tests run
        # acl and attr, the decompressors: the fixtures are real stagings (GNU tar
        # at the writer's floor, setfacl, each algorithm's tool).
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck gawk mawk busybox acl attr gzip xz-utils zstd
          shellcheck --version | head -2
          gawk --version | head -1
          mawk -W version 2>&1 | head -1
          busybox 2>&1 | head -1
          tar --version | head -1

      - name: bash -n and shellcheck
        run: |
          bash -n src/volume/heir/RESTORE.sh
          shellcheck -S warning src/volume/heir/RESTORE.sh

      - name: The script under gawk, mawk and BusyBox awk
        env:
          TAPECTL_REQUIRE_HEIR_TOOLS: "1"
        run: |
          cargo build --locked --example heir_age
          cargo test --locked --test heir_restore lint_

  man-drift:
    name: Man pages in sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Regenerate and diff
        # Any clap change must ship its regenerated docs/man (CLAUDE.md rule).
        run: |
          cargo run --locked --example gen_man
          git diff --exit-code docs/man

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Red today by a known cause: quick-xml RUSTSEC-2026-0194/0195, reachable
    # only via the dead catalog_xml module. Becomes blocking when #42 lands
    # (remove this line then).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit
        run: cargo audit
